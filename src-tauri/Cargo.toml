[package]
name = "webpro-mdx"
version = "0.2.1"
description = "Offline MDX editor for WEBPRO SEO Insights articles"
authors = ["WEBPRO International Inc."]
edition = "2021"

[lib]
name = "webpro_mdx_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
zip = "2"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
